[project]
name = "spikesorting"
version = "0.1.0"
description = "Agentic spike sorting with VLM-based curation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy<1.14",
    "matplotlib",
    "pandas>=1.3.0",
    "spikeinterface>=0.103.1",
    "h5py",
    "neuron<9",
    "LFPy",
    "MEArec",
    "mountainsort5>=0.5.9",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
]

[project.scripts]
agentic-spikesorting = "src.pipeline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
